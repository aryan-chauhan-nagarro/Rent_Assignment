<!-- Main Application Navigation Bar -->
<nav class="navbar">
  <a routerLink="/" class="brand">RentHub</a>

  <!-- Navigation actions conditional on authentication state -->
  <div class="nav-links">
    @if (auth.isLoggedIn()) {
      <span>Welcome, {{ auth.currentUser()?.name }}</span>
      <a routerLink="/inquiries" class="nav-inquiries">
        Inquiries
        @if (inquiryService.receivedCount() > 0) {
          <span class="nav-badge">{{ inquiryService.receivedCount() }}</span>
        }
      </a>
      <a routerLink="/create">Create Post</a>
      <button (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login">Login</a>
      <a routerLink="/register">Register</a>
    }
  </div>
</nav>

<!-- Main Page Content Outlet -->
<main class="container">
  <router-outlet />
</main>

<!-- Global Toast Notification Display -->
<app-toast-container />
